name: data-verse

on:
  push:
    paths:
      - "apps/data-verse/**"
      - "packages/viz-contracts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/data-verse.yml"
  pull_request:
    paths:
      - "apps/data-verse/**"
      - "packages/viz-contracts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/data-verse.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cortex/viz-contracts build
      - run: pnpm --filter @cortex/data-verse build
