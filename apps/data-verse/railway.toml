{
  "$schema": "https://railway.com/railway.schema.json",
  "build": {
    "builder": "NIXPACKS",
    "buildCommand": "pnpm --filter @cortex/viz-contracts build && pnpm --filter @cortex/data-verse build"
  },
  "deploy": {
    "startCommand": "pnpm --filter @cortex/data-verse start",
    "restartPolicyType": "ON_FAILURE",
    "restartPolicyMaxRetries": 3
  }
}
