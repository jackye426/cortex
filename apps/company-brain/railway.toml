{
  "$schema": "https://railway.com/railway.schema.json",
  "build": {
    "builder": "NIXPACKS",
    "buildCommand": "pnpm --filter @cortex/company-brain-server build"
  },
  "deploy": {
    "startCommand": "pnpm --filter @cortex/company-brain-server start",
    "restartPolicyType": "ON_FAILURE",
    "restartPolicyMaxRetries": 3
  }
}
